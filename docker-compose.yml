version: '3.9'
services:
  server:
    build:
      context: ./server
    image: giapha-server:local
    restart: unless-stopped
    environment:
      # Use MongoDB Atlas - connection string from .env file
      MONGODB_URI: mongodb+srv://allinoneuser:Viet686868@allinone.cniws0g.mongodb.net/giapha?retryWrites=true&w=majority&appName=allinone
      PORT: 3000
    volumes:
      - ./uploads:/app/uploads
    # no host port needed; web container proxies to this service
  web:
    build:
      context: ./web
    image: giapha-web:local
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"
    volumes:
      - ./web/public/downloads:/usr/share/nginx/html/downloads
