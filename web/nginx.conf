server {
  listen 80;
  server_name _;

  # Static SPA
  root /usr/share/nginx/html;
  index index.html;

  # Gzip
  gzip on;
  gzip_types text/plain application/javascript application/x-javascript text/javascript text/xml text/css application/xml application/json image/svg+xml;

  # API proxy
  location /api/ {
    proxy_pass http://server:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Uploads proxy
  location /uploads/ {
    proxy_pass http://server:3000/uploads/;
    proxy_set_header Host $host;
  }

  # Try static files, fallback to index.html for SPA routes
  location / {
    try_files $uri $uri/ /index.html;
  }
}
