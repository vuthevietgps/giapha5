<mat-sidenav-container class="app-shell" style="height: 100vh;">
	<mat-sidenav mode="side" opened style="width: 260px;">
		<div style="display:flex; align-items:center; gap:8px; padding: 16px;">
			<mat-icon>account_tree</mat-icon>
			<strong>Gia Phả Online version1</strong>
		</div>
		<mat-nav-list>
			<a mat-list-item routerLink="/users" routerLinkActive="active">
				<mat-icon matListItemIcon>group</mat-icon>
				<span matListItemTitle>Người dùng</span>
			</a>
			<a mat-list-item routerLink="/families" routerLinkActive="active">
				<mat-icon matListItemIcon>diversity_3</mat-icon>
				<span matListItemTitle>Dòng họ</span>
			</a>
			<a mat-list-item routerLink="/positions" routerLinkActive="active">
				<mat-icon matListItemIcon>badge</mat-icon>
				<span matListItemTitle>Chức vụ</span>
			</a>
			<a mat-list-item routerLink="/members" routerLinkActive="active">
				<mat-icon matListItemIcon>person</mat-icon>
				<span matListItemTitle>Thành viên</span>
			</a>
			<a mat-list-item routerLink="/members/tree" routerLinkActive="active">
				<mat-icon matListItemIcon>account_tree</mat-icon>
				<span matListItemTitle>Cây gia phả</span>
			</a>
			<a mat-list-item routerLink="/members/branch" routerLinkActive="active">
				<mat-icon matListItemIcon>format_list_bulleted</mat-icon>
				<span matListItemTitle>Nhánh quan tâm</span>
			</a>
			<a mat-list-item routerLink="/backgrounds" routerLinkActive="active">
				<mat-icon matListItemIcon>image</mat-icon>
				<span matListItemTitle>Ảnh nền</span>
			</a>
			<a mat-list-item routerLink="/calendar" routerLinkActive="active">
				<mat-icon matListItemIcon>calendar_month</mat-icon>
				<span matListItemTitle>Lịch vạn niên</span>
			</a>
			<a mat-list-item routerLink="/members/branch-calendar" routerLinkActive="active">
				<mat-icon matListItemIcon>event</mat-icon>
				<span matListItemTitle>Lịch quan trọng</span>
			</a>
			<a mat-list-item routerLink="/posts" routerLinkActive="active">
				<mat-icon matListItemIcon>article</mat-icon>
				<span matListItemTitle>Bài viết</span>
			</a>
			<!-- Member tree menu -->
			<!-- Có thể thêm các menu khác sau này -->
		</mat-nav-list>
	</mat-sidenav>

	<mat-sidenav-content>
		<router-outlet />
	</mat-sidenav-content>
</mat-sidenav-container>
