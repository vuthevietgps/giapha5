<p>family-form works!</p>
<mat-card class="card page-container">
	<form [formGroup]="form" (ngSubmit)="save()" style="display:grid; gap: 16px; max-width: 640px;">
		<h2>{{ id ? 'Sửa dòng họ' : 'Thêm dòng họ' }}</h2>

		<mat-form-field appearance="outline">
			<mat-label>Tên dòng họ</mat-label>
			<input matInput formControlName="name" />
		</mat-form-field>

		<mat-form-field appearance="outline">
			<mat-label>Mô tả dòng họ</mat-label>
			<textarea matInput formControlName="description" rows="3" placeholder="Nhập mô tả về dòng họ (tùy chọn)"></textarea>
		</mat-form-field>

		<mat-form-field appearance="outline">
			<mat-label>Tên người liên hệ</mat-label>
			<input matInput formControlName="contactName" />
		</mat-form-field>

		<mat-form-field appearance="outline">
			<mat-label>Số điện thoại</mat-label>
			<input matInput formControlName="contactPhone" />
		</mat-form-field>

		<mat-form-field appearance="outline">
			<mat-label>Địa chỉ dòng họ</mat-label>
			<input matInput formControlName="address" />
		</mat-form-field>

		<!-- Admin selection - only for SUPER_ADMIN -->
		<mat-form-field appearance="outline" *ngIf="canManageAdmins">
			<mat-label>Chọn Admin dòng họ</mat-label>
			<mat-select formControlName="adminId" placeholder="Chọn người quản lý dòng họ">
				<mat-option value="">-- Chưa chỉ định --</mat-option>
				<mat-option *ngFor="let admin of availableAdmins" [value]="admin.id">
					{{ admin.fullName }} ({{ admin.email }})
				</mat-option>
			</mat-select>
			<mat-hint>Chỉ có thể chọn người dùng có role ADMIN_DONG_HO</mat-hint>
		</mat-form-field>

		<div style="display:flex; gap: 8px;">
			<button mat-flat-button color="primary" type="submit">Lưu</button>
			<a mat-stroked-button routerLink="/families">Hủy</a>
		</div>
	</form>
</mat-card>
