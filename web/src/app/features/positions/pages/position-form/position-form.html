<mat-card class="card page-container">
  <form [formGroup]="form" (ngSubmit)="save()" style="display:grid; gap: 16px; max-width: 640px;">
    <h2>{{ id ? 'Sửa chức vụ' : 'Thêm chức vụ' }}</h2>

    <mat-form-field appearance="outline">
      <mat-label>Tên chức vụ</mat-label>
      <input matInput formControlName="name" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Mô tả</mat-label>
      <input matInput formControlName="description" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Thứ tự</mat-label>
      <input matInput type="number" formControlName="sortOrder" />
    </mat-form-field>

    <div style="display:flex; gap: 8px;">
      <button mat-flat-button color="primary" type="submit">Lưu</button>
      <a mat-stroked-button routerLink="/positions">Hủy</a>
    </div>
  </form>
</mat-card>
