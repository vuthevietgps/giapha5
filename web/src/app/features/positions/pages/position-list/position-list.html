<mat-toolbar color="primary">
  <span>Quản lý chức vụ</span>
  <span style="flex:1 1 auto"></span>
  <a mat-flat-button color="accent" routerLink="/positions/new">
    <mat-icon>add</mat-icon>
    Thêm mới
  </a>
</mat-toolbar>

<mat-card class="card page-container table-wrapper">
  <table mat-table [dataSource]="data" class="mat-elevation-z2" style="width: 100%">
    <ng-container matColumnDef="sortOrder">
      <th mat-header-cell *matHeaderCellDef>Thứ tự</th>
      <td mat-cell *matCellDef="let e">{{ e.sortOrder }}</td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Tên chức vụ</th>
      <td mat-cell *matCellDef="let e">{{ e.name }}</td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Mô tả</th>
      <td mat-cell *matCellDef="let e">{{ e.description }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Hành động</th>
      <td mat-cell *matCellDef="let e">
        <a mat-stroked-button color="primary" [routerLink]="['/positions', e.id, 'edit']">
          <mat-icon>edit</mat-icon>
          Sửa
        </a>
        <button mat-stroked-button color="warn" (click)="delete(e.id)">
          <mat-icon>delete</mat-icon>
          Xóa
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</mat-card>
