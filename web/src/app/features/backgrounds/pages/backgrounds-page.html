<div class="shell">
  <div class="toolbar">
    <mat-form-field appearance="outline" class="family-field">
      <mat-label>Dòng họ</mat-label>
      <mat-select [value]="selectedFamilyId" (selectionChange)="onFamilyChange($event.value)">
        <mat-option *ngFor="let family of families" [value]="family.id">{{ family.name }}</mat-option>
      </mat-select>
    </mat-form-field>

    <button mat-stroked-button color="primary" (click)="fileInput.click()" [disabled]="!selectedFamilyId">
      <mat-icon>upload</mat-icon>
      Tải ảnh lên
    </button>
    <input type="file" accept="image/*" #fileInput hidden (change)="onFile($event)">

    <span class="hint">Quản lý ảnh nền theo từng dòng họ để dùng cho cây gia phả và màn in.</span>
  </div>

  <div class="grid">
    <div class="item" *ngFor="let it of items">
      <img [src]="fileUrl(it)" alt="Ảnh nền">
      <div class="name">{{ it.name }}</div>
      <div class="actions">
        <button mat-icon-button color="warn" (click)="remove(it)">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </div>
  </div>
</div>
