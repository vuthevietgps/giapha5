<p>user-form works!</p>
<mat-card>
	<form [formGroup]="form" (ngSubmit)="save()" style="display: grid; gap: 16px; max-width: 600px;">
		<h2>{{ id ? 'Sửa người dùng' : 'Thêm người dùng' }}</h2>

		<mat-form-field appearance="outline">
			<mat-label>Họ tên</mat-label>
			<input matInput formControlName="fullName" />
		</mat-form-field>

		<mat-form-field appearance="outline">
			<mat-label>Email đăng nhập</mat-label>
			<input matInput type="email" formControlName="email" />
		</mat-form-field>

		<mat-form-field appearance="outline">
			<mat-label>Mật khẩu</mat-label>
			<input matInput type="password" formControlName="password" />
			<mat-hint>Ít nhất 6 ký tự</mat-hint>
		</mat-form-field>

		<mat-form-field appearance="outline">
			<mat-label>Vai trò</mat-label>
			<mat-select formControlName="role">
				<mat-option *ngFor="let r of roles" [value]="r">{{ roleLabels[r] }}</mat-option>
			</mat-select>
		</mat-form-field>

		<div style="display:flex; gap: 8px;">
			<button mat-flat-button color="primary" type="submit">Lưu</button>
			<a mat-stroked-button color="accent" routerLink="/users">Hủy</a>
		</div>
	</form>
</mat-card>
